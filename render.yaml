services:
  - type: web
    name: api-animalitos
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: animalitos-db
          property: connectionString

databases:
  - name: animalitos-db
    plan: free
    databaseName: animalitos
    user: animalitos
